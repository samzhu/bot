plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	/*
	 * WHY / ARCHITECTURAL TRADE-OFF:
	 * GraalVM Native Image compilation and build-time Ahead-Of-Time (AOT) processing are explicitly out-of-scope
	 * for the Local Chat MVP. Applying org.graalvm.buildtools.native automatically triggers Spring Boot's AOT plugin
	 * and task registrations, introducing build-time analysis dependencies that are unneeded for local JVM development.
	 *
	 * RELEASE CONDITION TO RE-ENABLE:
	 * Re-enable this plugin when Native Image compilation or ahead-of-time processing is explicitly scheduled,
	 * verifying that active build profiles and datasource configurations are properly validated.
	 */
	// id 'org.graalvm.buildtools.native' version '1.1.14'
	id 'org.cyclonedx.bom' version '3.5.1'
}

group = 'io.github.samzhu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

sourceSets {
	localDevelopment {
		java.srcDirs = ['src/local/java']
		resources.srcDirs = ['src/local/resources']
		compileClasspath += sourceSets.main.output + configurations.compileClasspath
		runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
	}
}

configurations {
	localDevelopmentImplementation.extendsFrom implementation
	localDevelopmentRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.1.0-RC2")
	set('springModulithVersion', "2.1.1")
}

dependencies {
	implementation 'com.ag-ui.community:ag-ui-spring-server-core:4.1.0'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	// implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	// implementation 'org.springframework.boot:spring-boot-starter-security'
	// implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	// implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// implementation 'org.springaicommunity:mcp-client-security-spring-boot:0.1.14'
	implementation 'org.springframework.ai:spring-ai-jsoup-document-reader'
	implementation 'org.springframework.ai:spring-ai-markdown-document-reader'
	implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
	// implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
	// implementation 'org.springframework.ai:spring-ai-starter-model-chat-memory-repository-jdbc'
	implementation 'org.springframework.ai:spring-ai-session-jdbc'
	implementation 'org.springframework.ai:spring-ai-client-chat'
	// implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.ai:spring-ai-google-genai'
	// implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
	implementation 'org.springframework.ai:spring-ai-google-genai-embedding'
	// implementation 'org.springframework.ai:spring-ai-starter-tool-search-advisor'
	/*
	 * WHY / ARCHITECTURAL DEPENDENCY SEAM:
	 * 1. Prioritize raw modules over starters: starters (e.g. spring-ai-starter-vector-store-pgvector and
	 *    spring-ai-starter-model-google-genai-tts) bring in auto-configuration jars
	 *    (spring-ai-autoconfigure-vector-store-pgvector and spring-ai-autoconfigure-model-google-genai).
	 *    Because auto-configuration classes use @ConditionalOnProperty with matchIfMissing = true
	 *    or @ConditionalOnClass without property guards, having those jars on the classpath triggers
	 *    unwanted bean creation or context failures unless manually excluded.
	 * 2. By replacing starters with their corresponding raw modules (spring-ai-pgvector-store and
	 *    spring-ai-google-genai-tts), all Spring AI auto-configuration modules are removed from the classpath,
	 *    allowing clean programmatic configuration (e.g. GoogleGenAiManualConfig) with zero accidental beans.
	 * 3. spring-ai-vector-store-advisor is a raw library (depends only on spring-ai-client-chat and spring-ai-vector-store)
	 *    retained as a raw dependency seam for vector RAG without dragging in any starter or auto-config.
	 * 4. All Spring AI dependency versions are consistently governed by spring-ai-bom:${springAiVersion}.
	 */
	implementation 'org.springframework.ai:spring-ai-pgvector-store'
	implementation 'org.springframework.ai:spring-ai-vector-store-advisor'
	implementation 'org.springframework.ai:spring-ai-google-genai-transcription'
	implementation 'org.springframework.ai:spring-ai-google-genai-tts'
	// implementation 'org.springframework.modulith:spring-modulith-observability-api'
	// implementation 'org.springframework.modulith:spring-modulith-starter-core'
	// implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
	// implementation 'org.springframework.security:spring-security-webauthn'
	// implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	developmentOnly 'org.springframework.ai:spring-ai-spring-boot-docker-compose'
	// runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
	// runtimeOnly 'org.springframework.modulith:spring-modulith-observability-core'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-cache-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
	// testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
	// testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	// testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.ai:spring-ai-spring-boot-testcontainers'
	// testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.testcontainers:testcontainers-grafana'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation sourceSets.localDevelopment.output
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootRun {
	/*
	 * WHY / ARCHITECTURAL TRADE-OFF:
	 * Local development seed initializers and demonstration resources are isolated in the
	 * 'localDevelopment' sourceSet (src/local/java and src/local/resources) so they are
	 * available exclusively during local bootRun development execution, and are never compiled
	 * into or packaged within the production bootJar or container image.
	 */
	classpath += sourceSets.localDevelopment.output + sourceSets.localDevelopment.runtimeClasspath
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'real-ai'
	}
}

tasks.register('realAiSmokeTest', Test) {
	description = 'Runs live real AI smoke test against genuine external model provider.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'real-ai'
	}
	systemProperty 'smoke.real-ai', 'true'
	/*
	 * WHY:
	 * realAiSmokeTest is an opt-in live integration verification against an external cloud provider.
	 * Its outcome depends on real-time external network and remote API availability.
	 * Disabling Gradle up-to-date checking ensures that invoking this task always executes fresh
	 * live verification rather than returning false-positive cached UP-TO-DATE successes.
	 */
	outputs.upToDateWhen { false }
}
