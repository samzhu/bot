bot:
  conversation:
    window-turns: 10
  run:
    timeout: 180s
    heartbeat-interval: 15s

spring:
  application:
    name: bot
  # WHY / ARCHITECTURAL AUTO-CONFIGURATION ISOLATION:
  # All Spring AI starter dependencies (e.g. spring-ai-starter-model-google-genai-tts and
  # spring-ai-starter-vector-store-pgvector) have been replaced with their respective raw modules
  # (spring-ai-google-genai-tts and spring-ai-pgvector-store).
  # As verified via Gradle dependencyInsight, zero spring-ai-autoconfigure-* artifacts exist
  # on the runtime classpath. The previous 9 blanket exclusions for GoogleGenAi*AutoConfiguration
  # (chat, embedding connection, text embedding, image connection, image, tts connection, tts,
  # transcription connection, transcription) are removed because those auto-configuration classes
  # are completely absent from the application classpath.
  # All active AI beans are deterministically created via programmatic configuration (GoogleGenAiManualConfig, SessionConfig).
  ai:
    google:
      genai:
        chat:
          model: gemini-3.8-flash
