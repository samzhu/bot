server:
  address: 127.0.0.1
  port: 8080

spring:
  docker:
    compose:
      enabled: true
      profiles:
        active: ${spring.ai.model.chat:none}
  ai:
    ollama:
      chat:
        model: llama3.2:1b
    google:
      genai:
        tts:
          model: gemini-3.8-flash-tts
        transcription:
          model: gemini-3.5-transcribe
    openai:
      api-key: ${bot-openai-api-key:}
      chat:
        model: gpt-5-mini
