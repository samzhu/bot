logging:
  level:
    io.github.samzhu.bot: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  docker:
    compose:
      # Always reconcile the selected profile, but do not stop services that predate this app.
      start:
        skip: never
      lifecycle-management: start-only

---
spring:
  config:
    activate:
      on-profile: "local & !mock-ai & !test & !prod"
    import: "optional:file:./config/application-secrets.properties"
